spring.application.name=ai-code-review
spring.profiles.active=${SPRING_PROFILE:dev}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSL:disable}
spring.datasource.hikari.data-source-properties.sslrootcert=${DB_CERT_PATH}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

ai_code_review.auth.jwt.secret=${AUTH_JWT_SECRET}
ai_core_review.cors.allowed_origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}